name: runs on peachq
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Without the action: curl -fsSL --remote-name-all https://github.com/peachq-org/peachq/releases/download/v0.92.20261116/peachq-linux-x86_64.tar.gz{,.sha256}, sha256sum -c, tar -xzf
      - uses: peachq-org/setup-peachq@c66a4579d8d253e5467cc2d1647a20a440737931 # v1
        with:
          version: 0.92.20261116
      - run: $QCMD tests/run.q -classic
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peachq-junit
          path: junit.xml

name: runs on peachq
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without the action: curl -fsSL https://github.com/peachq-org/peachq/releases/download/v0.92.20261118/peachq-linux-x86_64.tar.gz | tar -xz
      - uses: peachq-org/setup-peachq@v1.1.0
        with:
          version: 0.92.20261118
      - run: $QCMD tests/run.q -classic
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peachq-junit
          path: junit.xml
